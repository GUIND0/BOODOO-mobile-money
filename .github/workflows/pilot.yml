name: Pilot release validation
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v0.1.*']
permissions:
  contents: read
concurrency:
  group: pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ["api-gateway", "audit-service", "customer-service", "distribution-service", "identity-service", "ledger-service", "limits-service", "notification-service", "pricing-service", "reconciliation-service", "risk-compliance-service", "transfer-service", "wallet-service"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: {distribution: temurin, java-version: '25', cache: maven}
      - name: Verify service against PostgreSQL
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/*.jar
          if-no-files-found: error
          retention-days: 3
  full-stack:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: {distribution: temurin, java-version: '25'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: 'jar-*', path: .artifacts}
      - name: Place verified executable jars
        shell: bash
        run: |
          for artifact in .artifacts/jar-*; do
            module=${artifact##*/jar-}
            mkdir -p "services/$module/target"
            cp "$artifact"/*.jar "services/$module/target/"
          done
      - name: Assemble API contracts
        shell: bash
        run: |
          unzip -p services/ledger-service/target/*.jar 'BOOT-INF/lib/snakeyaml-*.jar' > /tmp/boodoo-yaml.jar
          java --class-path /tmp/boodoo-yaml.jar scripts/CompileContracts.java .
      - name: Real-service fault, concurrency and backup/restore checks
        run: python3 scripts/pilot-e2e.py
  publish-images:
    if: startsWith(github.ref, 'refs/tags/v0.1.')
    needs: full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: pilot-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ["api-gateway", "audit-service", "customer-service", "distribution-service", "identity-service", "ledger-service", "limits-service", "notification-service", "pricing-service", "reconciliation-service", "risk-compliance-service", "transfer-service", "wallet-service"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Build from reviewed immutable base images
        env:
          BUILD_IMAGE: ${{ vars.JAVA_BUILD_IMAGE }}
          RUNTIME_IMAGE: ${{ vars.JAVA_RUNTIME_IMAGE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          [[ "$BUILD_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          [[ "$RUNTIME_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$registry/$SERVICE:$GITHUB_SHA"
          docker build --file deploy/service.Dockerfile --build-arg "SERVICE=$SERVICE" --build-arg "BUILD_IMAGE=$BUILD_IMAGE" --build-arg "RUNTIME_IMAGE=$RUNTIME_IMAGE" --tag "$image" .
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
