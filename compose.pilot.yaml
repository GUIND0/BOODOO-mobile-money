name: boodoo-pilot
services:
  api-gateway:
    image: ${BOODOO_REGISTRY:?}/api-gateway:${BOODOO_IMAGE_TAG:?}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    environment:
      SERVER_PORT: "8080"
      API_GATEWAY_JWT_ISSUER_URI: ${JWT_ISSUER_URI:?}
      API_GATEWAY_JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?}
      API_GATEWAY_WALLET_BASE_URL: http://wallet-service:8080
      API_GATEWAY_CUSTOMER_BASE_URL: http://customer-service:8080
      API_GATEWAY_IDENTITY_BASE_URL: http://identity-service:8080
      API_GATEWAY_LEDGER_BASE_URL: http://ledger-service:8080
      API_GATEWAY_PRICING_BASE_URL: http://pricing-service:8080
      API_GATEWAY_LIMITS_BASE_URL: http://limits-service:8080
      API_GATEWAY_RISK_BASE_URL: http://risk-compliance-service:8080
      API_GATEWAY_AUDIT_BASE_URL: http://audit-service:8080
      API_GATEWAY_NOTIFICATION_BASE_URL: http://notification-service:8080
      API_GATEWAY_TRANSFER_BASE_URL: http://transfer-service:8080
    ports: ["127.0.0.1:8080:8080"]
  audit-service:
    image: ${BOODOO_REGISTRY:?}/audit-service:${BOODOO_IMAGE_TAG:?}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    environment:
      SERVER_PORT: "8080"
      AUDIT_JWT_ISSUER_URI: ${JWT_ISSUER_URI:?}
      AUDIT_JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?}
      AUDIT_DB_URL: jdbc:postgresql://audit-db:5432/audit_db
      AUDIT_DB_USER: audit_user
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?}
      AUDIT_WALLET_BASE_URL: http://wallet-service:8080
      AUDIT_CUSTOMER_BASE_URL: http://customer-service:8080
      AUDIT_IDENTITY_BASE_URL: http://identity-service:8080
      AUDIT_LEDGER_BASE_URL: http://ledger-service:8080
      AUDIT_PRICING_BASE_URL: http://pricing-service:8080
      AUDIT_LIMITS_BASE_URL: http://limits-service:8080
      AUDIT_RISK_BASE_URL: http://risk-compliance-service:8080
      AUDIT_AUDIT_BASE_URL: http://audit-service:8080
      AUDIT_NOTIFICATION_BASE_URL: http://notification-service:8080
      AUDIT_TRANSFER_BASE_URL: http://transfer-service:8080
    depends_on:
      audit-db: {condition: service_healthy}
  audit-db:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${AUDIT_DB_ADMIN_PASSWORD:?}
      APP_DB_USER: audit_user
      APP_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bootstrap -d audit_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - audit-data:/var/lib/postgresql/data
      - ./deploy/init-app-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
  customer-service:
    image: ${BOODOO_REGISTRY:?}/customer-service:${BOODOO_IMAGE_TAG:?}
