spring:
  application:
    name: risk-compliance-service
  datasource:
    url: ${RISK_COMPLIANCE_DB_URL:jdbc:postgresql://localhost:5441/risk_compliance_db}
    username: ${RISK_COMPLIANCE_DB_USER:risk_compliance_user}
    password: ${RISK_COMPLIANCE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

server:
  port: ${RISK_COMPLIANCE_SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

boodoo:
  security:
    issuer: ${RISK_COMPLIANCE_JWT_ISSUER_URI}
    jwk-set-uri: ${RISK_COMPLIANCE_JWT_JWK_SET_URI}
    audience: ${RISK_COMPLIANCE_JWT_AUDIENCE:boodoo-risk-compliance-api}
  risk:
    version: ${RISK_POLICY_VERSION}
    automatic-amount: ${RISK_AUTOMATIC_AMOUNT}
    ttl-seconds: ${RISK_EVALUATION_TTL_SECONDS}
    blocked-customers: ${RISK_BLOCKED_CUSTOMERS:}
