services:
  risk_compliance-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: risk_compliance_db
      POSTGRES_USER: risk_compliance_user
      POSTGRES_PASSWORD: ${RISK_COMPLIANCE_DB_PASSWORD:?Set RISK_COMPLIANCE_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - risk_compliance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  risk_compliance_postgres_data:
