services:
  pricing-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pricing_db
      POSTGRES_USER: pricing_user
      POSTGRES_PASSWORD: ${PRICING_DB_PASSWORD:?Set PRICING_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pricing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pricing_postgres_data:
