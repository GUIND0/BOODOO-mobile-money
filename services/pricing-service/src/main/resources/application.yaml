spring:
  application:
    name: pricing-service
  datasource:
    url: ${PRICING_DB_URL:jdbc:postgresql://localhost:5439/pricing_db}
    username: ${PRICING_DB_USER:pricing_user}
    password: ${PRICING_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PRICING_SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
