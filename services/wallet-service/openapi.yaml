openapi: 3.1.0
info:
  title: BOODOO Wallet Provisioning API
  version: 0.1.0
  description: XOF wallet provisioning, controlled accounting-backed activation and fresh operational eligibility. No funding, transfer posting or OTP.
paths:
  /v1/wallets:
    post:
      operationId: createPendingWallet
      summary: Provision an owned customer's pending XOF wallet
      description: >-
        Requires wallets:write and customers:ownership:read with both service audiences.
        Tenant derives from signed JWT claims. Ownership is checked on each request, including replay.
        Currency is trimmed and uppercased. Same-key canonical replay returns the original snapshot;
        differing payload reuse conflicts. A new key for an existing customer/currency conflicts.
      security:
        - partnerBearer: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customerId, currency]
              properties:
                customerId: {type: string, format: uuid}
                currency:
                  type: string
                  description: Only XOF after trimming and uppercasing
                  examples: [XOF, xof]
      responses:
        '201':
          description: Pending wallet created or original creation replayed; Cache-Control no-store
          headers:
            Location:
              description: Relative metadata resource URI
              schema: {type: string, format: uri-reference}
            Idempotency-Replayed:
              schema: {type: boolean}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wallet'}
        '400':
          description: INVALID_REQUEST or UNSUPPORTED_CURRENCY
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '401': {description: Missing or invalid bearer identity or required audiences}
        '403': {description: Missing write scope or customer ownership permission}
        '404': {description: Unknown or foreign customer}
        '409': {description: IDEMPOTENCY_CONFLICT or WALLET_ALREADY_EXISTS}
        '415': {description: Unsupported request content type}
        '503': {description: Ownership or storage unavailable; retry with the same key}
  /v1/wallets/{walletId}:
    get:
      operationId: getPendingWallet
      summary: Read wallet metadata after a fresh ownership check
      description: Requires wallets:read and customers:ownership:read with both service audiences. No financial eligibility is inferred.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: walletId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Tenant-scoped wallet metadata, Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wallet'}
        '400': {description: Invalid wallet UUID}
        '401': {description: Missing or invalid bearer identity or required audiences}
        '403': {description: Missing read scope or customer ownership permission}
        '404': {description: Unknown or foreign wallet or customer}
        '503': {description: Ownership or storage unavailable; metadata is not returned}
  /internal/v1/wallets/{id}/activate:
    post:
      operationId: activateWallet
      description: Service-only wallets:activate; Idempotency-Key required. Current KYC and PIN configuration, deterministic liability account and zero balance are checked. Token needs all downstream audiences/scopes.
      security: [{partnerBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      responses:
        '201': {description: Completed activation snapshot; original key replays without new side effects}
        '409': {description: Ineligible facts, conflicting key/actor or nonempty account}
        '503': {description: Dependency unavailable; intent remains resumable}
  /internal/v1/wallets/{id}/operational-state:
    get:
      operationId: getWalletOperationalState
      description: Service-only wallets:eligibility:read; active wallets recheck fresh KYC and PIN configuration. Observation only, not a financial authorization lease.
      security: [{partnerBearer: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: walletId, customerId, currency, status, nullable ledgerAccountId, eligible and checkedAt}
        '404': {description: Unknown or foreign wallet}
        '503': {description: Eligibility dependency could not be checked}
components:
  securitySchemes:
    partnerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Wallet:
      type: object
      additionalProperties: false
      required: [id, customerId, currency, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        currency: {type: string, enum: [XOF]}
        status: {type: string, enum: [PENDING, ACTIVE]}
        createdAt: {type: string, format: date-time}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
