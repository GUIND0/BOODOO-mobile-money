spring:
  application:
    name: wallet-service
  datasource:
    url: ${WALLET_DB_URL:jdbc:postgresql://localhost:5433/wallet_db}
    username: ${WALLET_DB_USER:wallet_user}
    password: ${WALLET_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

server:
  port: ${WALLET_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

boodoo:
  security:
    issuer: ${WALLET_JWT_ISSUER_URI}
    jwk-set-uri: ${WALLET_JWT_JWK_SET_URI}
    audience: ${WALLET_JWT_AUDIENCE:boodoo-wallet-api}
    customer-audience: ${WALLET_CUSTOMER_AUDIENCE:boodoo-customer-api}
  customers:
    base-url: ${WALLET_CUSTOMER_BASE_URL:http://127.0.0.1:8084}
  dependencies:
    origins:
      customer: ${WALLET_CUSTOMER_BASE_URL:http://127.0.0.1:8084}
      identity: ${WALLET_IDENTITY_BASE_URL:http://127.0.0.1:8086}
      ledger: ${WALLET_LEDGER_BASE_URL:http://127.0.0.1:8083}
