openapi: 3.1.0
info:
  title: BOODOO Customer API
  version: 0.1.0
  description: Partner-scoped customer onboarding and explicit operator KYC review. No OTP, PIN management or financial operations.
paths:
  /v1/customers:
    get:
      operationId: listCustomers
      summary: List the authenticated integrator's customer summaries
      description: >-
        Requires customers:read. Live keyset pagination by ascending UUID, not creation time.
        Keep the same filter across pages; concurrent changes are not snapshotted.
        No phone, address or evidence is returned. Cursor values never grant tenant access.
      security:
        - partnerBearer: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: after
          schema: {type: string, format: uuid}
        - in: query
          name: kycStatus
          schema: {type: string, enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]}
      responses:
        '200':
          description: Customer summaries, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfter]
                properties:
                  nextAfter: {type: [string, 'null'], format: uuid}
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, externalReference, firstName, lastName, kycStatus, createdAt]
                      properties:
                        id: {type: string, format: uuid}
                        externalReference: {type: string}
                        firstName: {type: string}
                        lastName: {type: string}
                        kycStatus: {type: string, enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]}
                        createdAt: {type: string, format: date-time}
        '400':
          description: Invalid limit, cursor or status
        '401':
          description: Missing or invalid bearer identity
        '403':
          description: Missing customers:read scope
        '503':
          description: Customer storage temporarily unavailable
    post:
      operationId: createCustomer
      summary: Create a minimal customer with pending KYC
      description: >-
        Requires customers:write and a trusted integrator_id claim. Keys, external references,
        and phone numbers are unique within the integrator. A same-key replay with identical
        normalized fields returns the original 201 response; a different payload conflicts.
        Leading/trailing whitespace is stripped before validation and fingerprinting.
      security:
        - partnerBearer: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
      responses:
        '201':
          description: Customer created, or original creation replayed
          headers:
            Idempotency-Replayed:
              description: True for an existing creation result
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid request or idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid bearer identity or required partner claims
        '403':
          description: Valid identity lacks customers:write
        '409':
          description: CUSTOMER_ALREADY_EXISTS or IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported request content type
        '503':
          description: Storage unavailable; retry the same profile with the same key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/customers/by-reference:
    get:
      operationId: findCustomerByReference
      summary: Find the current profile by an integrator's exact external reference
      description: Requires customers:read. Case-sensitive, trimmed reference; tenant derives from JWT.
      security:
        - partnerBearer: []
      parameters:
        - in: query
          name: externalReference
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Current profile with ETag and Cache-Control no-store
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '400': {description: Missing or invalid reference}
        '401': {description: Missing or invalid bearer identity}
        '403': {description: Missing customers:read}
        '404': {description: Unknown or foreign reference}
        '503': {description: Customer storage unavailable}
  /internal/v1/customers/{customerId}/kyc-approval:
    get:
      operationId: getCurrentKycApproval
      summary: Read current KYC approval metadata for a trusted service
      description: >-
        Requires customers:kyc:read, signed actor_type service and a stable subject.
        Checks active decision, frozen revision and evidence expiry at checkedAt UTC.
        A point-in-time observation only, not financial authorization or a validity lease.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current metadata, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [customerId, kycStatus, profileVersion, decisionId, reviewedAt, approvalCurrent, checkedAt]
                properties:
                  customerId: {type: string, format: uuid}
                  kycStatus: {type: string, enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]}
                  profileVersion: {type: integer, format: int64}
                  decisionId: {type: [string, 'null'], format: uuid}
                  reviewedAt: {type: [string, 'null'], format: date-time}
                  approvalCurrent: {type: boolean}
                  checkedAt: {type: string, format: date-time}
        '400': {description: Invalid customer UUID}
        '401': {description: Missing or invalid bearer identity}
        '403': {description: Missing scope or service identity}
        '404': {description: Unknown or foreign customer}
        '503': {description: Customer storage unavailable}
  /internal/v1/customers/{customerId}/ownership:
    get:
      operationId: checkCustomerOwnership
      summary: Confirm that a customer belongs to the authenticated integrator
      description: Requires customers:ownership:read; returns no profile data or KYC changes.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Customer belongs to the authenticated integrator; empty response
        '401':
          description: Missing or invalid bearer identity
        '403':
          description: Missing customers:ownership:read scope
        '404':
          description: Customer missing or foreign; empty response
  /v1/customers/{customerId}/profile-history:
    get:
      operationId: listCustomerProfileHistory
      summary: Read immutable manual profile-edit metadata
      description: Requires customers:audit:read, signed operator claim and stable subject. No profile values; excludes KYC transitions.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: afterVersion
          schema: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        '200':
          description: Revision-ordered metadata with Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfterVersion]
                properties:
                  nextAfterVersion: {type: [integer, 'null'], format: int64}
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [version, actorId, changedFields, changedAt]
                      properties:
                        version: {type: integer, format: int64}
                        actorId: {type: string}
                        changedFields: {type: array, items: {type: string}}
                        changedAt: {type: string, format: date-time}
        '400': {description: Invalid identifiers or pagination}
        '401': {description: Missing or invalid bearer identity}
        '403': {description: Missing audit scope or operator identity}
        '404': {description: Unknown or foreign customer}
        '503': {description: Customer storage unavailable}
  /v1/customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Read the authenticated integrator's current customer profile
      description: Requires customers:read; foreign and missing customers both return 404.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current profile, Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid UUID
        '401':
          description: Missing or invalid bearer identity
        '403':
          description: Missing customers:read
        '404':
          description: CUSTOMER_NOT_FOUND
        '503':
          description: CUSTOMER_OPERATION_UNAVAILABLE
    patch:
      operationId: updateCustomerProfile
      summary: Complete an integrator-owned profile with optimistic concurrency
      description: Requires customers:write and a stable JWT sub. Omitted/null fields remain unchanged.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: If-Match
          required: true
          description: Strong quoted profile revision returned by GET
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Current enriched profile with ETag and no-store caching
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': {description: Invalid fields or ETag}
        '401': {description: Invalid bearer identity}
        '403': {description: Missing write scope or actor}
        '404': {description: Missing or foreign customer}
        '409': {description: Profile frozen by KYC}
        '412': {description: Stale profile revision}
        '428': {description: If-Match required}
        '503': {description: Storage unavailable}
  /v1/customers/{customerId}/kyc-submissions:
    get:
      operationId: listCustomerKycSubmissions
      summary: List historical and active KYC submission summaries
      description: Requires kyc:read. Live UUID order; each status comes from its own decision. No profile, evidence or actor data.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: after
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Dossier summaries, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfter]
                properties:
                  nextAfter: {type: [string, 'null'], format: uuid}
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, profileVersion, status, submittedAt]
                      properties:
                        id: {type: string, format: uuid}
                        profileVersion: {type: integer, format: int64}
                        status: {type: string, enum: [UNDER_REVIEW, APPROVED, REJECTED]}
                        submittedAt: {type: string, format: date-time}
        '400': {description: Invalid identifiers or pagination}
        '401': {description: Missing or invalid bearer identity}
        '403': {description: Missing kyc:read scope}
        '404': {description: Unknown or foreign customer}
        '503': {description: Customer storage unavailable}
    post:
      operationId: submitCustomerKyc
      summary: Submit a complete profile and immutable evidence references for review
      description: Requires kyc:submit and stable JWT sub. No automatic identity verification or approval.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        - in: header
          name: If-Match
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [documents]
              properties:
                documents:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    $ref: '#/components/schemas/KycDocument'
      responses:
        '201':
          description: Dossier submitted or original snapshot replayed; Idempotency-Replayed header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmission'
        '400': {description: Invalid or expired document metadata}
        '401': {description: Invalid bearer identity}
        '403': {description: Missing scope or actor}
        '404': {description: Missing or foreign customer}
        '409': {description: Incomplete profile, active dossier or conflicting key}
        '412': {description: Profile revision changed}
        '428': {description: If-Match required}
        '503': {description: Storage unavailable}
  /v1/customers/{customerId}/kyc-submissions/{submissionId}:
    get:
      operationId: getCustomerKycSubmission
      summary: Read an integrator-owned dossier snapshot
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: submissionId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Dossier and review status; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDossier'
        '401': {description: Invalid bearer identity}
        '403': {description: Requires kyc:read}
        '404': {description: Unknown, foreign or mismatched dossier}
  /v1/customers/{customerId}/kyc-submissions/{submissionId}/decisions:
    post:
      operationId: reviewCustomerKyc
      summary: Record an independent operator's final KYC review decision
      description: >-
        Requires kyc:review, signed actor_type operator and stable JWT sub different from the submitter.
        Records an explicit review decision, not automatic identity verification or financial authorization.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: submissionId
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reasonCode]
              properties:
                decision: {type: string, enum: [APPROVED, REJECTED]}
                reasonCode: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
      responses:
        '201':
          description: Immutable decision recorded or original response replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDecision'
        '400': {description: Invalid UUID, body or key}
        '401': {description: Invalid bearer identity}
        '403': {description: Missing review scope/operator identity, or self review}
        '404': {description: Missing or foreign customer or dossier}
        '409': {description: Already decided, stale dossier, expired approval evidence or conflicting key}
        '503': {description: Storage unavailable}
  /v1/kyc-review-queue:
    get:
      operationId: listKycReviewQueue
      summary: List active dossiers available to the authenticated review operator
      description: >-
        Requires kyc:review, signed actor_type operator and a stable subject. Tenant-scoped;
        excludes own submissions, finalized dossiers and stale frozen revisions.
        Returns metadata only. Read a dossier separately with kyc:read.
        Live UUID-ordered pagination, not a reservation or approval eligibility guarantee.
      security:
        - partnerBearer: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: after
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current queue metadata, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, nextAfter]
                properties:
                  nextAfter: {type: [string, 'null'], format: uuid}
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [submissionId, customerId, profileVersion, submittedAt]
                      properties:
                        submissionId: {type: string, format: uuid}
                        customerId: {type: string, format: uuid}
                        profileVersion: {type: integer, format: int64}
                        submittedAt: {type: string, format: date-time}
        '400':
          description: Invalid limit or cursor
        '401':
          description: Missing or invalid bearer identity
        '403':
          description: Missing review scope, operator claim or stable subject
        '503':
          description: Customer storage temporarily unavailable
components:
  securitySchemes:
    partnerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        RS256 token from the configured issuer, for the configured audience, with exp,
        integrator_id and the endpoint-specific customer or KYC scope. Review also requires
        actor_type operator and an independent reviewer subject. The issuer assigns these claims.
  schemas:
    CreateCustomer:
      type: object
      additionalProperties: false
      required: [externalReference, firstName, lastName, phoneNumber]
      properties:
        externalReference:
          type: string
          minLength: 1
          maxLength: 128
          description: Integrator customer reference; case-sensitive and not whitespace-only
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phoneNumber:
          type: string
          pattern: '^\+[1-9][0-9]{1,14}$'
          description: International format; ownership verification belongs to the integrator
    Customer:
      type: object
      additionalProperties: false
      required: [id, externalReference, firstName, lastName, phoneNumber, kycStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        externalReference:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        kycStatus:
          type: string
          const: PENDING
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum: [INVALID_REQUEST, CUSTOMER_ALREADY_EXISTS, IDEMPOTENCY_CONFLICT, CUSTOMER_CREATION_UNAVAILABLE, UNSUPPORTED_MEDIA_TYPE, CUSTOMER_NOT_FOUND, CUSTOMER_OPERATION_UNAVAILABLE, PRECONDITION_REQUIRED, PROFILE_VERSION_CONFLICT, PROFILE_LOCKED_FOR_KYC, ACTOR_REQUIRED, PROFILE_INCOMPLETE, KYC_SUBMISSION_CONFLICT,
                 KYC_SUBMISSION_NOT_FOUND, KYC_DOCUMENT_EXPIRED, OPERATOR_REQUIRED, SELF_REVIEW_FORBIDDEN,
                 KYC_DECISION_EXISTS, STALE_KYC_SUBMISSION]

    Profile:
      type: object
      additionalProperties: false
      required: [id, externalReference, firstName, lastName, phoneNumber, kycStatus, createdAt, version, updatedAt]
      properties:
        id: {type: string, format: uuid}
        externalReference: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        phoneNumber: {type: string}
        kycStatus: {type: string, enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]}
        createdAt: {type: string, format: date-time}
        version: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
        dateOfBirth: {type: [string, 'null'], format: date}
        nationality: {type: [string, 'null']}
        residenceCountry: {type: [string, 'null']}
        addressLine: {type: [string, 'null']}
        city: {type: [string, 'null']}
    ProfilePatch:
      type: object
      additionalProperties: false
      description: At least one non-null field; dates in past, countries real ISO alpha-2 codes
      properties:
        firstName: {type: [string, 'null'], minLength: 1, maxLength: 100}
        lastName: {type: [string, 'null'], minLength: 1, maxLength: 100}
        dateOfBirth: {type: [string, 'null'], format: date}
        nationality: {type: [string, 'null']}
        residenceCountry: {type: [string, 'null']}
        addressLine: {type: [string, 'null'], minLength: 1, maxLength: 200}
        city: {type: [string, 'null'], minLength: 1, maxLength: 100}

    KycDocument:
      type: object
      additionalProperties: false
      required: [type, reference, issuingCountry]
      properties:
        type: {type: string, enum: [NATIONAL_ID, PASSPORT, RESIDENCE_PERMIT]}
        reference: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        issuingCountry: {type: string, description: ISO alpha-2 country}
        expiresOn: {type: [string, 'null'], format: date}
    KycSubmission:
      type: object
      additionalProperties: false
      required: [id, customerId, status, profileVersion, profile, documents, submittedBy, submittedAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        status: {type: string, enum: [UNDER_REVIEW, APPROVED, REJECTED]}
        profileVersion: {type: integer}
        profile:
          $ref: '#/components/schemas/Profile'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KycDocument'
        submittedBy: {type: string}
        submittedAt: {type: string, format: date-time}

    KycDecision:
      type: object
      additionalProperties: false
      required: [id, customerId, submissionId, status, reasonCode, reviewedBy, reviewedAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        submissionId: {type: string, format: uuid}
        status: {type: string, enum: [APPROVED, REJECTED]}
        reasonCode: {type: string}
        reviewedBy: {type: string}
        reviewedAt: {type: string, format: date-time}
    KycDossier:
      type: object
      additionalProperties: false
      required: [id, customerId, status, profileVersion, profile, documents, submittedBy, submittedAt, decision]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        status: {type: string, enum: [UNDER_REVIEW, APPROVED, REJECTED]}
        profileVersion: {type: integer}
        profile:
          $ref: '#/components/schemas/Profile'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KycDocument'
        submittedBy: {type: string}
        submittedAt: {type: string, format: date-time}
        decision:
          anyOf:
            - $ref: '#/components/schemas/KycDecision'
            - type: 'null'
