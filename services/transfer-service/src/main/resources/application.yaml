spring:
  application:
    name: transfer-service
  datasource:
    url: ${TRANSFER_DB_URL:jdbc:postgresql://localhost:5445/transfer_db}
    username: ${TRANSFER_DB_USER:transfer_user}
    password: ${TRANSFER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  flyway:
    enabled: true

server:
  port: ${TRANSFER_SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

boodoo:
  security:
    issuer: ${TRANSFER_JWT_ISSUER_URI}
    jwk-set-uri: ${TRANSFER_JWT_JWK_SET_URI}
    audience: ${TRANSFER_JWT_AUDIENCE:boodoo-transfer-api}
  transfers:
    service-tokens-json: ${TRANSFER_SERVICE_TOKENS_JSON:{}}
    fee-accounts-json: ${TRANSFER_FEE_ACCOUNTS_JSON:{}}
  dependencies:
    origins:
      wallet: ${TRANSFER_WALLET_BASE_URL:http://127.0.0.1:8081}
      pricing: ${TRANSFER_PRICING_BASE_URL:http://127.0.0.1:8088}
      identity: ${TRANSFER_IDENTITY_BASE_URL:http://127.0.0.1:8086}
      limits: ${TRANSFER_LIMITS_BASE_URL:http://127.0.0.1:8089}
      risk: ${TRANSFER_RISK_BASE_URL:http://127.0.0.1:8090}
      ledger: ${TRANSFER_LEDGER_BASE_URL:http://127.0.0.1:8083}
      audit: ${TRANSFER_AUDIT_BASE_URL:http://127.0.0.1:8092}
      notification: ${TRANSFER_NOTIFICATION_BASE_URL:http://127.0.0.1:8087}
