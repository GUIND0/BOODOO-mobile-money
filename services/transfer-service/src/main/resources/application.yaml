spring:
  application:
    name: transfer-service
  datasource:
    url: ${TRANSFER_DB_URL:jdbc:postgresql://localhost:5433/transfer_db}
    username: ${TRANSFER_DB_USER:transfer_user}
    password: ${TRANSFER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${TRANSFER_SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
