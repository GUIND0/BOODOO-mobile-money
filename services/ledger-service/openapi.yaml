openapi: 3.1.0
info:
  title: BOODOO Ledger Accounts API
  version: 0.1.0
  description: Signed ledger:post:transfer, ledger:post:settlement or ledger:post:adjustment grant required in addition to journal-write scope. Service-scoped immutable accounts, balanced XOF journals and derived balances. Wallet activation and transfer orchestration are separate.
paths:
  /internal/v1/accounts:
    post:
      operationId: createLedgerAccount
      summary: Create immutable accounting account metadata
      description: >-
        Requires ledger:accounts:write, trusted integrator_id, signed actor_type service and a stable subject.
        Code and currency are trimmed and uppercased. The normal balance side derives from account type.
        Idempotency is scoped by tenant and bound to account details plus service subject.
      security:
        - serviceBearer: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, currency, type]
              properties:
                code:
                  type: string
                  description: Opaque identifier matching uppercase A-Z followed by up to 63 uppercase letters, digits, underscores or hyphens after normalization
                  examples: [SETTLEMENT_CASH]
                currency:
                  type: string
                  description: XOF after trimming and uppercasing
                  examples: [XOF]
                type: {$ref: '#/components/schemas/AccountType'}
      responses:
        '201':
          description: Account created or original snapshot replayed; Cache-Control no-store
          headers:
            Location:
              schema: {type: string, format: uri-reference}
            Idempotency-Replayed:
              schema: {type: boolean}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {description: Invalid account details or idempotency key}
        '401': {description: Missing or invalid bearer identity or audience}
        '403': {description: Missing write scope or trusted service identity}
        '409': {description: IDEMPOTENCY_CONFLICT or ACCOUNT_ALREADY_EXISTS}
        '415': {description: Unsupported request content type}
        '503': {description: Storage unavailable; retry creation with the original key}
  /internal/v1/accounts/{accountId}:
    get:
      operationId: getLedgerAccount
      summary: Read account metadata in the authenticated tenant
      description: Requires ledger:accounts:read, signed actor_type service and a stable subject. No accounting balance is returned.
      security:
        - serviceBearer: []
      parameters:
        - in: path
          name: accountId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Account metadata, Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {description: Invalid account UUID}
        '401': {description: Missing or invalid bearer identity}
        '403': {description: Missing read scope or trusted service identity}
        '404': {description: Unknown or foreign account}
        '503': {description: Storage unavailable}
  /internal/v1/journals:
    post:
      operationId: postJournal
      summary: Atomically post balanced immutable XOF entries
      description: Requires service identity and ledger:journals:write. Canonical actor-bound idempotency, unique reference and nonnegative normal balances.
      security: [{serviceBearer: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reference, entries]
              properties:
                reference: {type: string, format: uuid}
                entries:
                  type: array
                  minItems: 2
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [accountId, side, amount]
                    properties:
                      accountId: {type: string, format: uuid}
                      side: {type: string, enum: [DEBIT, CREDIT]}
                      amount: {type: integer, format: int64, minimum: 1}
      responses:
        '201': {description: Immutable journal receipt with ID, reference, currency, createdAt and canonical entries; Idempotency-Replayed indicates a retry}
        '400': {description: Invalid, duplicate-account or unbalanced entries}
        '401': {description: Invalid token}
        '403': {description: Missing scope or service identity}
        '404': {description: Unknown or foreign account}
        '409': {description: Key/reference conflict, insufficient normal balance or overflow}
        '503': {description: Storage unavailable; retry original key}
  /internal/v1/journals/{id}:
    get:
      operationId: getJournal
      description: Requires ledger:journals:read and service identity. No-store immutable receipt.
      security: [{serviceBearer: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Journal receipt}
        '404': {description: Unknown or foreign journal}
  /internal/v1/journals/by-reference:
    get:
      operationId: getJournalByReference
      description: Requires ledger:journals:read and service identity; resolves uncertain outcomes.
      security: [{serviceBearer: []}]
      parameters: [{in: query, name: reference, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Original journal receipt}
        '404': {description: Reference not posted in this tenant}
  /internal/v1/accounts/{id}/balance:
    get:
      operationId: getAccountBalance
      description: Requires ledger:balances:read and service identity; derives a current normal balance from immutable entries.
      security: [{serviceBearer: []}]
      parameters: [{in: path, name: id, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: accountId, currency, normalBalance side and integer amountMinorUnits}
        '404': {description: Unknown or foreign account}
  /internal/v1/reconciliation/snapshot:
    get:
      operationId: getReconciliationSnapshot
      description: Requires ledger:reconciliation:read and service identity. Internal integrity only; no bank settlement verification.
      security: [{serviceBearer: []}]
      responses:
        '200': {description: journalCount, unbalancedJournals, invalidBalances and checkedAt from one SQL snapshot}
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AccountType:
      type: string
      enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE]
    Account:
      type: object
      additionalProperties: false
      required: [id, code, currency, type, normalBalance, createdAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_-]{0,63}$'}
        currency: {type: string, enum: [XOF]}
        type: {$ref: '#/components/schemas/AccountType'}
        normalBalance:
          type: string
          enum: [DEBIT, CREDIT]
          description: Normal accounting side derived from type, not a monetary balance
        createdAt: {type: string, format: date-time}
