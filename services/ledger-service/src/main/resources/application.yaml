spring:
  application:
    name: ledger-service
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5434/ledger_db}
    username: ${LEDGER_DB_USER:ledger_user}
    password: ${LEDGER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

server:
  port: ${LEDGER_SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

boodoo:
  security:
    issuer: ${LEDGER_JWT_ISSUER_URI}
    jwk-set-uri: ${LEDGER_JWT_JWK_SET_URI}
    audience: ${LEDGER_JWT_AUDIENCE:boodoo-ledger-api}
