services:
  distribution-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: distribution_db
      POSTGRES_USER: distribution_user
      POSTGRES_PASSWORD: ${DISTRIBUTION_DB_PASSWORD:?Set DISTRIBUTION_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - distribution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  distribution_postgres_data:
