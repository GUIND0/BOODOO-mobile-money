spring:
  application:
    name: distribution-service
  datasource:
    url: ${DISTRIBUTION_DB_URL:jdbc:postgresql://localhost:5436/distribution_db}
    username: ${DISTRIBUTION_DB_USER:distribution_user}
    password: ${DISTRIBUTION_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${DISTRIBUTION_SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
