spring:
  application:
    name: agent-service
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://localhost:5436/agent_db}
    username: ${AGENT_DB_USER:agent_user}
    password: ${AGENT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${AGENT_SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
