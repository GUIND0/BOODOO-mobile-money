spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5438/notification_db}
    username: ${NOTIFICATION_DB_USER:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

server:
  port: ${NOTIFICATION_SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

boodoo:
  webhooks:
    destinations-json: ${NOTIFICATION_WEBHOOK_DESTINATIONS_JSON:{}}
    enabled: ${NOTIFICATION_WEBHOOK_ENABLED:false}
  security:
    issuer: ${NOTIFICATION_JWT_ISSUER_URI}
    jwk-set-uri: ${NOTIFICATION_JWT_JWK_SET_URI}
    audience: ${NOTIFICATION_JWT_AUDIENCE:boodoo-notification-api}
