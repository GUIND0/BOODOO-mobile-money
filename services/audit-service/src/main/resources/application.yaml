spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5443/audit_db}
    username: ${AUDIT_DB_USER:audit_user}
    password: ${AUDIT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${AUDIT_SERVER_PORT:8092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
