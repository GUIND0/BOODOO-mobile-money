openapi: 3.1.0
info:
  title: Audit Service — immutable service events
  version: 0.1.0
paths:
  /internal/v1/events:
    post:
      operationId: appendAuditEvent
      description: Requires service identity and audit:events:write. Event UUID is actor-bound idempotency key; body id, resourceId, type and uppercase reasonCode only.
      security: [{serviceBearer: []}]
      responses:
        '201': {description: Immutable event with authenticated producer and server timestamp; exact retries replay}
        '409': {description: Event ID conflicts with producer or payload}
    get:
      operationId: listResourceAuditEvents
      description: Requires service identity and audit:events:read; no-store live UUID pagination.
      security: [{serviceBearer: []}]
      parameters:
        - {in: query, name: resourceId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: after, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200': {description: items and nextAfter, limited to signed integrator}
components:
  securitySchemes:
    serviceBearer: {type: http, scheme: bearer, bearerFormat: JWT}
