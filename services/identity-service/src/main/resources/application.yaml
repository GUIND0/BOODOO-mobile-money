spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5437/identity_db}
    username: ${IDENTITY_DB_USER:identity_user}
    password: ${IDENTITY_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

server:
  port: ${IDENTITY_SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

boodoo:
  security:
    issuer: ${IDENTITY_JWT_ISSUER_URI}
    jwk-set-uri: ${IDENTITY_JWT_JWK_SET_URI}
    audience: ${IDENTITY_JWT_AUDIENCE:boodoo-identity-api}
    customer-audience: ${IDENTITY_CUSTOMER_AUDIENCE:boodoo-customer-api}
  customers:
    base-url: ${IDENTITY_CUSTOMER_BASE_URL:http://127.0.0.1:8084}
  pin:
    pepper: ${IDENTITY_PIN_PEPPER}
    pepper-version: ${IDENTITY_PIN_PEPPER_VERSION:v1}
