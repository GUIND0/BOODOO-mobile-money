openapi: 3.1.0
info:
  title: BOODOO Transaction PIN API
  version: 0.1.0
  description: First PIN setup and verification. No OTP, PIN change/recovery, payment authorization or KYC approval.
paths:
  /v1/customers/{customerId}/pin:
    get:
      operationId: getCustomerPinStatus
      summary: Read whether an owned customer has configured a transaction PIN
      description: >-
        Requires pins:read, customers:ownership:read and both service audiences.
        Checks remote ownership before local state. No comparison, counter mutation or payment authorization.
        A configured credential may still be temporarily locked; no lock/credential details are exposed.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Configuration flag only, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [customerId, configured]
                properties:
                  customerId: {type: string, format: uuid}
                  configured: {type: boolean}
        '400': {description: Invalid customer UUID}
        '401': {description: Missing or invalid bearer identity or audiences}
        '403': {description: Missing read scope or ownership permission}
        '404': {description: Unknown or foreign customer}
        '503': {description: Ownership or PIN status storage unavailable; never reported as false}
    post:
      operationId: createCustomerPin
      summary: Create the customer's first transaction PIN
      description: >-
        Requires pins:create and customers:ownership:read, a trusted integrator_id, and
        audiences for Identity and Customer Services. Customer ownership is checked through
        Customer Service, including on replay. Ten confirmed-ownership setup attempts per
        integrator/customer per 15-minute window include replays and conflicts. Sensitive creation
        replays also share verification's five-failure lock and thirty-comparison budget.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin:
                  type: string
                  writeOnly: true
                  pattern: '^[0-9]{6}$'
                  description: >-
                    Six ASCII digits, preserving leading zeros. Repeated digits and ascending
                    or descending sequences, including wraparound, are rejected.
                  example: '739152'
      responses:
        '201':
          description: First PIN created or original creation replayed; never returns the PIN
          headers:
            Idempotency-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinCreation'
        '400':
          description: Invalid UUID, PIN, fields or idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Bearer identity, issuer, expiration, partner claim or audiences invalid
        '403':
          description: Required PIN or ownership permission missing
        '404':
          description: Customer missing or not owned by this integrator
        '409':
          description: PIN_ALREADY_EXISTS or IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Use Content-Type application/json
        '429':
          description: PIN_SETUP_RATE_LIMITED, PIN_VERIFICATION_LOCKED or PIN_VERIFICATION_RATE_LIMITED
          headers:
            Retry-After:
              schema:
                type: integer
                const: 900
        '503':
          description: OWNERSHIP_UNAVAILABLE, PIN_CREATION_UNAVAILABLE or PIN_KEY_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/customers/{customerId}/pin/verify:
    post:
      operationId: verifyCustomerPin
      summary: Verify a transaction PIN without changing it
      description: >-
        Requires pins:verify and customers:ownership:read, the trusted integrator_id, and both
        service audiences. Fresh ownership is checked. A 204 confirms the PIN only, not a
        transaction authorization. Five consecutive failures lock comparisons for 15 minutes;
        thirty comparisons per customer/integrator per 15-minute window are allowed. Counters
        and lockout are shared with sensitive creation replays. Idempotency keys do not deduplicate attempts.
      security:
        - partnerBearer: []
      parameters:
        - in: path
          name: customerId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin:
                  type: string
                  writeOnly: true
                  pattern: '^[0-9]{6}$'
                  description: Exact six-digit string; leading zeros preserved; no strength-policy filtering
                  example: '739152'
      responses:
        '204':
          description: PIN matches; empty response, no token or authorization grant
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          description: Invalid UUID, PIN format or unknown fields
        '401':
          description: Missing or invalid bearer identity
        '403':
          description: Missing pins:verify or customers:ownership:read scope
        '404':
          description: CUSTOMER_NOT_FOUND or PIN_NOT_CONFIGURED
        '415':
          description: Use application/json
        '422':
          description: PIN_INVALID; failure is persisted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: PIN_VERIFICATION_LOCKED or PIN_VERIFICATION_RATE_LIMITED
          headers:
            Retry-After:
              description: Conservative retry delay; does not reset lockout
              schema:
                type: integer
                const: 900
        '503':
          description: OWNERSHIP_UNAVAILABLE, PIN_KEY_UNAVAILABLE or PIN_VERIFICATION_UNAVAILABLE
components:
  securitySchemes:
    partnerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        RS256 token from the trusted issuer, with integrator_id, exp, both intended service
        audiences, and the endpoint scope (pins:create or pins:verify) plus customers:ownership:read. The token is relayed
        only to the configured Customer Service ownership endpoint; no PIN is forwarded.
  schemas:
    PinCreation:
      type: object
      additionalProperties: false
      required: [customerId, status, createdAt]
      properties:
        customerId:
          type: string
          format: uuid
        status:
          type: string
          const: CREATED
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum: [INVALID_REQUEST, UNSUPPORTED_MEDIA_TYPE, CUSTOMER_NOT_FOUND, OWNERSHIP_FORBIDDEN,
                 OWNERSHIP_UNAVAILABLE, PIN_ALREADY_EXISTS, IDEMPOTENCY_CONFLICT, PIN_SETUP_RATE_LIMITED,
                 PIN_CREATION_UNAVAILABLE, PIN_KEY_UNAVAILABLE, PIN_NOT_CONFIGURED, PIN_INVALID,
                 PIN_VERIFICATION_LOCKED, PIN_VERIFICATION_RATE_LIMITED, PIN_VERIFICATION_UNAVAILABLE]
