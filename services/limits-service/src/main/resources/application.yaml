spring:
  application:
    name: limits-service
  datasource:
    url: ${LIMITS_DB_URL:jdbc:postgresql://localhost:5440/limits_db}
    username: ${LIMITS_DB_USER:limits_user}
    password: ${LIMITS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${LIMITS_SERVER_PORT:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
