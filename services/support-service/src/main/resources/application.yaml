spring:
  application:
    name: support-service
  datasource:
    url: ${SUPPORT_DB_URL:jdbc:postgresql://localhost:5444/support_db}
    username: ${SUPPORT_DB_USER:support_user}
    password: ${SUPPORT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SUPPORT_SERVER_PORT:8093}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
