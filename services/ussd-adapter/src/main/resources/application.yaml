spring:
  application:
    name: ussd-adapter
  datasource:
    url: ${USSD_DB_URL:jdbc:postgresql://localhost:5445/ussd_db}
    username: ${USSD_DB_USER:ussd_user}
    password: ${USSD_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${USSD_SERVER_PORT:8094}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
