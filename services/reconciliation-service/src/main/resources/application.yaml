spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${RECONCILIATION_DB_URL:jdbc:postgresql://localhost:5442/reconciliation_db}
    username: ${RECONCILIATION_DB_USER:reconciliation_user}
    password: ${RECONCILIATION_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true

server:
  port: ${RECONCILIATION_SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

boodoo:
  security:
    issuer: ${RECONCILIATION_JWT_ISSUER_URI}
    jwk-set-uri: ${RECONCILIATION_JWT_JWK_SET_URI}
    audience: ${RECONCILIATION_JWT_AUDIENCE:boodoo-reconciliation-api}
  dependencies:
    origins:
      ledger: ${RECONCILIATION_LEDGER_BASE_URL:http://127.0.0.1:8083}
