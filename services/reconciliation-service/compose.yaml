services:
  reconciliation-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reconciliation_db
      POSTGRES_USER: reconciliation_user
      POSTGRES_PASSWORD: ${RECONCILIATION_DB_PASSWORD:?Set RECONCILIATION_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - reconciliation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reconciliation_postgres_data:
